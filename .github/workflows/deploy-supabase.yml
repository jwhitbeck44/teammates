name: Deploy Supabase (database and email functions)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/deploy-supabase.yml"

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  # The database tests run before anything is pushed to the real project.
  test:
    # Pinned: ubuntu-latest (26.04) has no postgresql-16 package, which run.sh needs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Make sure PostgreSQL 16 is installed
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ] || [ ! -x /usr/bin/psql ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16 postgresql-client-16
          fi

      # run.sh starts its own throwaway cluster as the current (non-root) user and stops it afterwards.
      - name: Run the database tests
        run: bash supabase/tests/run.sh

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      # Defaults to the GitHub Pages address of this repository; set the APP_URL secret to override (custom domain).
      APP_URL: ${{ secrets.APP_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      # The 15 minute email timer's own secret. Must equal the Vault secret cron_secret (DEPLOY.md step 7).
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 3.2.0  # pinned (npm view supabase version, 2026-11-16); raise it on purpose

      - name: Check required secrets
        run: |
          missing=0
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_REF; do
            if [ -z "${!v}" ]; then echo "::error::Repository secret $v is not set"; missing=1; fi
          done
          exit $missing

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      # CLI 3: db push targets the local stack unless --remote is given, and hosted writes in CI need --yes.
      - name: Push database migrations
        run: supabase db push --remote --yes --password "$SUPABASE_DB_PASSWORD"

      - name: Deploy Edge Functions
        run: |
          for fn in email-dispatch send-reminder recover-links; do
            supabase functions deploy "$fn" --project-ref "$SUPABASE_PROJECT_REF" --use-api --yes
          done

      - name: Set function secrets (only those present)
        run: |
          args=()
          [ -n "$APP_URL" ] && args+=("APP_URL=$APP_URL")
          [ -n "$EMAIL_FROM" ] && args+=("EMAIL_FROM=$EMAIL_FROM")
          [ -n "$RESEND_API_KEY" ] && args+=("RESEND_API_KEY=$RESEND_API_KEY")
          [ -n "$CRON_SECRET" ] && args+=("CRON_SECRET=$CRON_SECRET")
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::Repository secret CRON_SECRET is not set. Automatic emails (opened, closing soon, published) stay off until it is set and equals the Vault secret cron_secret (DEPLOY.md step 7)."
          fi
          if [ "${#args[@]}" -gt 0 ]; then
            supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" --yes "${args[@]}"
          else
            echo "No APP_URL, EMAIL_FROM, RESEND_API_KEY or CRON_SECRET secrets set; skipping."
          fi
